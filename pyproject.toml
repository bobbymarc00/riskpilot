[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpilot-agent-os"
version = "1.0.0"
description = "Fail-closed Binance Agent OS Spot trading copilot with human-approved paper execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
riskpilot = "spotguard.cli:main"
spotguard = "spotguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotguard = ["locales/*.json"]
